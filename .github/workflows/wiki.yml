name: wiki

# Publishes docs/user-manual.md to the GitHub wiki, one page per section. The wiki is generated: edit the manual.
on:
  push:
    branches: [main]
    paths:
      - docs/user-manual.md
      - docs/images/**
      - scripts/build-wiki.py
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - name: Build pages
        run: python3 scripts/build-wiki.py wiki
      - name: Push
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update from docs/user-manual.md at ${GITHUB_SHA::7}"
          git push
