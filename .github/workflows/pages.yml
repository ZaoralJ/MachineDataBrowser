name: pages

# Builds the documentation site from docs/ with MkDocs Material and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/mkdocs-requirements.txt
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/mkdocs-requirements.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/mkdocs-requirements.txt
      - run: pip install -r .github/mkdocs-requirements.txt
      # --strict fails on broken links, so pull requests catch them before they reach the site.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
