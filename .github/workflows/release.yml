name: release

# Stable releases: called by release-please after its release PR is merged (the release already exists
# with the changelog as notes; this attaches the artifacts). Pre-releases: push a vX.Y.Z-pre tag manually.
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Tag must be vX.Y.Z[-pre]"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || { echo "Tag must point to a commit on main"; exit 1; }
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  macos:
    name: build & publish
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Package
        run: packaging/macos/package.sh "${TAG#v}" arm64 x64
      - name: Generate cask
        run: |
          v="${TAG#v}"
          arm=$(grep 'osx-arm64.zip' artifacts/dist/checksums.txt | cut -d' ' -f1)
          x64=$(grep 'osx-x64.zip' artifacts/dist/checksums.txt | cut -d' ' -f1)
          sed -e "s/version \".*\"/version \"$v\"/" \
              -e "s/REPLACE_WITH_ARM64_SHA256/$arm/" \
              -e "s/REPLACE_WITH_X64_SHA256/$x64/" \
              packaging/homebrew/machine-data-browser.rb > artifacts/dist/machine-data-browser.rb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # release-please already wrote the notes; generate them only for manually tagged releases.
          generate_release_notes: ${{ inputs.tag == '' }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            artifacts/dist/*.zip
            artifacts/dist/machine-data-browser.rb
            artifacts/dist/checksums.txt
      - name: Update Homebrew tap
        if: ${{ !contains(env.TAG, '-') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          [ -n "$TAP_DEPLOY_KEY" ] || { echo "::warning::TAP_DEPLOY_KEY not set, tap not updated"; exit 0; }
          mkdir -p ~/.ssh && echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:ZaoralJ/homebrew-tap.git tap
          mkdir -p tap/Casks && cp artifacts/dist/machine-data-browser.rb tap/Casks/machine-data-browser.rb
          cd tap
          # The cask was renamed from opcua-browser: Homebrew moves installed users over on their next upgrade.
          git rm -q --ignore-unmatch Casks/opcua-browser.rb
          [ -f cask_renames.json ] || echo '{}' > cask_renames.json
          jq '. + {"opcua-browser": "machine-data-browser"}' cask_renames.json > cask_renames.tmp && mv cask_renames.tmp cask_renames.json
          git config user.name "Jaroslav Zaoral"
          git config user.email "zaoralj@gmail.com"
          git add Casks/machine-data-browser.rb cask_renames.json
          git diff --cached --quiet || { git commit -q -m "machine-data-browser ${TAG#v}"; git push -q; }
