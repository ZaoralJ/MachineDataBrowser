name: ci

on:
  push:
    branches: [main]
    # Release commits (changelog + version) and docs-only changes have nothing to build: the code was tested in its
    # pull request, the release workflow tests the tagged commit again, and docs are built by the pages workflow.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - "**/*.md"
      - docs/**
      - mkdocs.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: "**/screenshots/*.png"
          if-no-files-found: ignore

  macos:
    name: build & package (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Package app bundle
        run: packaging/macos/package.sh 0.0.0-ci arm64
      - name: Package CLI
        run: |
          packaging/cli/package.sh 0.0.0-ci osx-arm64
          artifacts/publish/cli-osx-arm64/mdbrowser --version
