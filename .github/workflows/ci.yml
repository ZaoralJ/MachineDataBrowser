name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect build changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes that need a build
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          build_exclusions='(^docs/|(^|/)[^/]*\.md$|^mkdocs\.yml$|^\.release-please-manifest\.json$)'
          build_files=$(printf '%s\n' "$changed_files" | grep -Ev "$build_exclusions" || true)
          if [[ -n "$build_files" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: build & test (linux)
    needs: changes
    # A skipped job reports success, so metadata-only PRs still satisfy this required check.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: "**/screenshots/*.png"
          if-no-files-found: ignore

  macos:
    name: build & package (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Package app bundle
        run: packaging/macos/package.sh 0.0.0-ci arm64
      - name: Package CLI
        run: |
          packaging/cli/package.sh 0.0.0-ci osx-arm64
          artifacts/publish/cli-osx-arm64/mdbrowser --version
