version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*", "Dock.*"]
      opcua:
        patterns: ["OPCFoundation.*"]
      tests:
        patterns: ["xunit*", "Testcontainers*", "Microsoft.Extensions.TimeProvider.Testing"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
