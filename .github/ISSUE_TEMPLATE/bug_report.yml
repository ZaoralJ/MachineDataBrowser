name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the error message or a screenshot if possible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Connect to ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and OS
      placeholder: "0.1.0, macOS 26 (Apple Silicon)"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: OPC UA server (product/version), if relevant
